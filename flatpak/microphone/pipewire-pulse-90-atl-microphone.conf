# ~/.config/pipewire/pipewire-pulse.conf.d/90-atl-microphone.conf
# (docs/hardening-roadmap.md, phase 4: microphone). The pulseaudio socket
# refuses record streams of ATL app Flatpaks: the WirePlumber rule hides
# sources, but a sink's monitor (what other apps play) stays reachable
# through pipewire-pulse without this. Read when pipewire-pulse starts.
pulse.rules = [
  {
    matches = [ { pipewire.access.portal.app_id = "~de.nexumia.atl.*" } ]
    actions = { quirks = [ block-record-stream ] }
  }
  # one entry per allowed app id, matched later, clears the quirk
  #{
  #  matches = [ { pipewire.access.portal.app_id = "de.nexumia.atl.<package>" } ]
  #  actions = { quirks = [ ] }
  #}
]
