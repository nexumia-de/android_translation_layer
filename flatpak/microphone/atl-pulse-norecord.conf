# ~/.config/pipewire/atl-pulse-norecord.conf.d/50-atl.conf, with
# ~/.config/pipewire/atl-pulse-norecord.conf a link to the system's
# pipewire-pulse.conf (docs/hardening-roadmap.md, phase 4: microphone).
#
# A second pipewire-pulse that refuses every record stream (microphone and
# sink monitors) of every client. Apps whose RECORD_AUDIO answer is not
# "yes" get only this socket (make-app-flatpak); the others get the normal
# one. The rule matches every client whether application.name is set or
# not, so no client property can opt out: pulse clients can rewrite their
# properties (PULSE_PROP, UPDATE_CLIENT_PROPLIST), so the decision must not
# depend on them. @RUNTIME_DIR@ is $XDG_RUNTIME_DIR.
pulse.properties = {
  server.address = [ "unix:@RUNTIME_DIR@/atl-pulse-norecord/native" ]
  # clients must not load modules: a loopback from the microphone into a
  # pipe sink, an RTP sender or a tunnel records on the server side, where
  # block-record-stream does not apply (security review 2026-11-04)
  pulse.allow-module-loading = false
}
pulse.rules = [
  {
    matches = [ { application.name = "~.*" } { application.name = null } ]
    actions = { quirks = [ block-record-stream ] }
  }
]
