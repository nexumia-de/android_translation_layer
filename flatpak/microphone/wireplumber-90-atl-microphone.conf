# ~/.config/wireplumber/wireplumber.conf.d/90-atl-microphone.conf
# (docs/hardening-roadmap.md, phase 4: microphone). Clients of ATL app
# Flatpaks get no permissions on capture nodes; playback is unaffected.
# Apps whose RECORD_AUDIO answer is yes are listed in the second rule,
# which matches later and wins. Read when WirePlumber starts.
access.permission-managers = [
  {
    name = "atl-no-microphone"
    default_permissions = "rx"
    rules = [
      {
        matches = [ { media.class = "~Audio/Source.*" } ]
        actions = { set-permissions = "-" }
      }
    ]
  }
  { name = "atl-microphone", default_permissions = "rx" }
]
access.rules = [
  {
    matches = [ { pipewire.access.portal.app_id = "~de.nexumia.atl.*" } ]
    actions = { update-props = { permission_manager_name = "atl-no-microphone" } }
  }
  # one entry per allowed app id
  #{
  #  matches = [ { pipewire.access.portal.app_id = "de.nexumia.atl.<package>" } ]
  #  actions = { update-props = { permission_manager_name = "atl-microphone" } }
  #}
]
