# Builds the ATL engine Flatpak (flatpak/de.nexumia.atl.BaseApp.yml) for
# aarch64 and, on a push to phosh, publishes it in the owner's Flatpak
# repository https://flatpak.nexumia.de (docs/hardening-roadmap.md,
# phase 1).
#
# The bundles go to the rolling pre-release "engine" of this repository;
# nexumia-de/phosh-apps imports them from there, signs them and deploys
# the repository. With the secret PUBLISH_TOKEN (a token allowed to send
# repository_dispatch to phosh-apps) that happens right away, without it
# on phosh-apps' daily schedule.
#
# Only aarch64: the engine is for the phone, and generated app Flatpaks
# copy it on the phone (flatpak/make-app.sh).
name: Engine Flatpak

on:
  push:
    branches: [phosh]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [phosh]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: flatpak/de.nexumia.atl.BaseApp.yml
  APP_ID: de.nexumia.atl.BaseApp
  ARCH: aarch64

jobs:
  build:
    name: Build (aarch64)
    runs-on: ubuntu-24.04-arm
    # The first build without cache compiles art_standalone; later builds
    # reuse every unchanged module from the cache.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flatpak tooling
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          # eu-strip (elfutils) runs on every installed ELF file.
          "${apt[@]}" install -y -q --no-install-recommends flatpak flatpak-builder elfutils
          # Ubuntu 24.04 restricts unprivileged user namespaces, which
          # bubblewrap needs for the build sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # Restored and saved separately, so a failed or timed-out first
      # build still keeps the modules it finished.
      - name: Restore flatpak-builder state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: engine-${{ env.ARCH }}-${{ github.run_id }}
          restore-keys: engine-${{ env.ARCH }}-

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --ccache --force-clean --arch="$ARCH" --bundle-sources \
            --repo=flatpak/repo flatpak/build "$MANIFEST"

      - name: Save flatpak-builder state
        if: always() && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: engine-${{ env.ARCH }}-${{ github.run_id }}

      - name: Bundle
        run: |
          flatpak build-bundle --arch="$ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak/repo "$APP_ID-$ARCH.flatpak" "$APP_ID"
          # Corresponding source of every module, published next to the
          # engine like on Flathub.
          flatpak build-bundle --arch="$ARCH" --runtime \
            flatpak/repo "$APP_ID-sources-$ARCH.flatpak" "$APP_ID.Sources"
          ls -l ./*.flatpak

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_ID }}-${{ env.ARCH }}
          path: '*.flatpak'
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'phosh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # No cancel-in-progress: a stale run arriving later would cancel the
    # upload of the current one; the check below skips stale runs.
    concurrency:
      group: engine-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true

      - name: Attach bundles to the release "engine"
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/phosh" --jq .sha)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::phosh moved on to ${head::7}; its own run publishes it."
            exit 0
          fi
          notes="ATL engine Flatpak ($APP_ID) built from phosh · ${GITHUB_SHA::7} ($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA). Published at https://flatpak.nexumia.de; replaced by every engine build of phosh."
          if gh release view engine >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/engine" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload engine bundles/*.flatpak --clobber
            gh release edit engine --notes "$notes"
          else
            gh release create engine bundles/*.flatpak --target "$GITHUB_SHA" \
              --prerelease --title "ATL engine (Flatpak)" --notes "$notes"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Notify phosh-apps
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No PUBLISH_TOKEN; phosh-apps picks the engine up on its daily schedule."
            exit 0
          fi
          gh api repos/nexumia-de/phosh-apps/dispatches -f event_type=app-updated \
            -f "client_payload[repository]=$GITHUB_REPOSITORY"
